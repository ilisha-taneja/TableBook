<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TableBook — Restaurant Table Booking System</title>
  <meta name="description" content="TableBook is a frontend-only restaurant table booking system: manage tables, bookings, customers, availability, a booking calendar and reports — no backend required." />
  <meta name="theme-color" content="#0C0913" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    /* apply saved theme before first paint (no flash) */
    try {
      var t = localStorage.getItem('tablebook.theme');
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</head>
<body>

  <!-- ================= AUTH GATE ================= -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">TB</div>
        <h1>TableBook</h1>
        <p class="auth-tagline">Frontend-only table booking, made simple.</p>
      </div>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab is-active" data-auth-tab="login" role="tab">Login</button>
        <button class="auth-tab" data-auth-tab="register" role="tab">Register</button>
      </div>

      <form id="authForm" class="auth-form" novalidate>
        <div class="field" id="nameField" hidden>
          <label for="authName">Full name</label>
          <input type="text" id="authName" placeholder="Jane Doe" autocomplete="name" />
        </div>

        <div class="field">
          <label for="authEmail">Email</label>
          <input type="email" id="authEmail" placeholder="you@restaurant.com" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="authPassword">Password</label>
          <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password" required minlength="4" />
        </div>

        <div class="field">
          <label for="authRole">Role</label>
          <select id="authRole">
            <option value="Admin">Admin</option>
            <option value="Manager">Manager</option>
            <option value="Staff">Staff</option>
          </select>
        </div>

        <p class="form-error" id="authError" hidden></p>

        <button type="submit" class="btn btn-primary btn-block" id="authSubmit">Log in</button>
      </form>

      <p class="auth-note">Demo only — no backend. Accounts are stored in your browser (localStorage).</p>
    </div>
  </div>

  <!-- ================= APP SHELL ================= -->
  <div id="appShell" class="app-shell" hidden>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">TB</div>
        <span class="brand-name">TableBook</span>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <button class="nav-item is-active" data-page="dashboard" data-title="Dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-page="tables" data-title="Tables">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h18M6 9l-2 11M18 9l2 11M8 5h8l1 4H7zM12 5V3" fill-rule="evenodd"/></svg>
          <span>Tables</span>
        </button>
        <button class="nav-item" data-page="bookings" data-title="Bookings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3M17 3v3M4 8h16M5 6h14a1 1 0 011 1v13a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1zM8 13h3v3H8z"/></svg>
          <span>Bookings</span>
        </button>
        <button class="nav-item" data-page="layout" data-title="Table Layout">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
          <span>Table Layout</span>
        </button>
        <button class="nav-item" data-page="customers" data-title="Customers">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 20a8 8 0 0116 0z"/></svg>
          <span>Customers</span>
        </button>
        <button class="nav-item" data-page="availability" data-title="Availability">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 109 9h-9zM13 3v8h8A9 9 0 0013 3z"/></svg>
          <span>Availability</span>
        </button>
        <button class="nav-item" data-page="calendar" data-title="Calendar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v3M17 2v3M3 8h18M4 5h16a1 1 0 011 1v14a1 1 0 01-1 1H4a1 1 0 01-1-1V6a1 1 0 011-1zM8 12h2v2H8zM12 12h2v2h-2zM16 12h2v2h-2zM8 16h2v2H8zM12 16h2v2h-2z"/></svg>
          <span>Calendar</span>
        </button>
        <button class="nav-item" data-page="reports" data-title="Reports">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 16V9M12 16V5M17 16v-6"/></svg>
          <span>Reports</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="nav-item nav-item-ghost" id="logoutBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 17l5-5-5-5M20 12H9M11 4H6a1 1 0 00-1 1v14a1 1 0 001 1h5"/></svg>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="menuToggle" aria-label="Toggle navigation">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>

        <h2 class="topbar-title" id="topbarTitle">Dashboard</h2>

        <div class="topbar-right">
          <button class="icon-btn" id="themeToggle" aria-label="Toggle color theme" title="Toggle light / dark">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <span class="chip" id="dateChip"></span>
          <div class="user-chip" id="userChip">
            <span class="avatar" id="userAvatar">A</span>
            <span class="user-meta">
              <strong id="userName">Admin</strong>
              <small id="userRole">Admin</small>
            </span>
          </div>
        </div>
      </header>

      <main class="content" id="content">
        <!-- Pages are rendered by JS into these shells -->
        <section class="page" id="page-dashboard" data-page="dashboard"></section>
        <section class="page" id="page-tables" data-page="tables" hidden></section>
        <section class="page" id="page-bookings" data-page="bookings" hidden></section>
        <section class="page" id="page-layout" data-page="layout" hidden></section>
        <section class="page" id="page-customers" data-page="customers" hidden></section>
        <section class="page" id="page-availability" data-page="availability" hidden></section>
        <section class="page" id="page-calendar" data-page="calendar" hidden></section>
        <section class="page" id="page-reports" data-page="reports" hidden></section>
      </main>
    </div>
  </div>

  <!-- ================= MODAL ================= -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h3 id="modalTitle">Modal</h3>
        <button class="icon-btn" id="modalClose" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <form id="modalForm" class="modal-body" novalidate></form>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <!-- ================= TOASTS ================= -->
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/tables.js"></script>
  <script src="js/pages/bookings.js"></script>
  <script src="js/pages/layout.js"></script>
  <script src="js/pages/customers.js"></script>
  <script src="js/pages/availability.js"></script>
  <script src="js/pages/calendar.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
